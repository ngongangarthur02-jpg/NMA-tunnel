name: Build NMA Tunnel APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NMA_MASTER_SECRET: ${{ secrets.NMA_MASTER_SECRET }}
      NMA_ADMIN_PASSWORD: ${{ secrets.NMA_ADMIN_PASSWORD }}
      NMA_KEYSTORE_B64: ${{ secrets.NMA_KEYSTORE_B64 }}
      NMA_KEYSTORE_PASSWORD: ${{ secrets.NMA_KEYSTORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dézipper le projet
        run: |
          echo "Fichiers du dépôt :"; ls -la
          rm -rf proj && mkdir proj
          # Prend le zip envoyé en dernier (peu importe son nom : NMATunnel.zip, NMATunnel (1).zip…)
          BEST=""; BESTT=0
          for f in *.zip; do
            [ -f "$f" ] || continue
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            if [ -z "$BEST" ] || [ "${T:-0}" -gt "$BESTT" ]; then BEST="$f"; BESTT="${T:-0}"; fi
          done
          if [ -n "$BEST" ]; then
            echo "Zip utilisé : $BEST"
            unzip -q "$BEST" -d proj
          fi
          ROOT=$(find proj -maxdepth 4 -name settings.gradle.kts | head -1)
          if [ -z "$ROOT" ]; then ROOT=$(find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' | head -1); fi
          if [ -z "$ROOT" ]; then
            echo "ERREUR : projet introuvable. Envoie le fichier NMATunnel.zip à la racine du dépôt."
            exit 1
          fi
          echo "PROJ=$(dirname "$ROOT")" >> "$GITHUB_ENV"
          echo "Projet : $(dirname "$ROOT")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compiler l'APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - name: Publier dans Releases
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' "$PROJ/app/build.gradle.kts")
          cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" NMA-Tunnel.apk
          gh release delete "v$VERSION" --yes --cleanup-tag || true
          gh release create "v$VERSION" NMA-Tunnel.apk --title "NMA Tunnel $VERSION" \
            --notes "NMA Tunnel version $VERSION" --latest
            
